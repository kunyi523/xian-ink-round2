name: Assemble hotfix core files
on:
  workflow_dispatch:
  push:
    paths:
      - "grok-parts/*.gz.b64"
      - "grok-parts/*.gz.b64.*"
      - ".github/workflows/assemble-hotfix.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzip+base64 into 游戏核心
        run: |
          set -euo pipefail
          mkdir -p "游戏核心"
          # Concat split WorldCanvas parts if needed
          if [ ! -f grok-parts/WorldCanvas.tsx.gz.b64 ] && [ -f grok-parts/WorldCanvas.tsx.gz.b64.0 ] && [ -f grok-parts/WorldCanvas.tsx.gz.b64.1 ]; then
            cat grok-parts/WorldCanvas.tsx.gz.b64.0 grok-parts/WorldCanvas.tsx.gz.b64.1 > grok-parts/WorldCanvas.tsx.gz.b64
            echo "concatenated WorldCanvas parts"
          fi
          python3 << 'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          mapping = {
            "grok-parts/ink.ts.gz.b64": "游戏核心/ink.ts",
            "grok-parts/WorldCanvas.tsx.gz.b64": "游戏核心/WorldCanvas.tsx",
            "grok-parts/ui.tsx.gz.b64": "游戏核心/ui.tsx",
          }
          for src, dest in mapping.items():
            p = Path(src)
            if not p.exists():
              print("skip missing", src)
              continue
            raw = gzip.decompress(base64.b64decode(p.read_text().encode("ascii")))
            Path(dest).write_bytes(raw)
            print(dest, len(raw), hashlib.sha256(raw).hexdigest())
          PY
          wc -c "游戏核心/ink.ts" "游戏核心/WorldCanvas.tsx" "游戏核心/ui.tsx" || true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "游戏核心/ink.ts" "游戏核心/WorldCanvas.tsx" "游戏核心/ui.tsx" || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "hotfix: decode 游戏核心 from grok-parts gz.b64 (2026-09-14)"
            git push
          fi
