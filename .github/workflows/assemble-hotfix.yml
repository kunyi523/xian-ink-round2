name: Assemble hotfix core files
on:
  workflow_dispatch:
  push:
    paths:
      - "grok-parts/**"
      - ".github/workflows/assemble-hotfix.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode gzip+base64 into game core
        run: |
          set -euo pipefail
          mkdir -p "游戏核心"
          python3 << 'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          parts = Path("grok-parts")

          def ensure(name: str) -> Path:
              whole = parts / f"{name}.gz.b64"
              p0 = parts / f"{name}.gz.b64.0"
              p1 = parts / f"{name}.gz.b64.1"
              if p0.exists() and p1.exists():
                  text = p0.read_text().strip() + p1.read_text().strip()
                  whole.write_text(text)
                  print("concat", name, len(text))
                  return whole
              if whole.exists():
                  return whole
              raise FileNotFoundError(name)

          expect = {
              "游戏核心/ink.ts": "911bd6fcdda841004f2264cfb6ae27c9011882ab16e026169ad4f1dd344fcd6e",
              "游戏核心/WorldCanvas.tsx": "e093171db97b99289344482a47b3d4447df7baa399274fa92376faf6cd2f192b",
              "游戏核心/ui.tsx": "1e51b3ed5732c3432c23b00d098246d6fab3a3a7bbbe0394dfd913d74f3e72d7",
          }
          mapping = {
              "ink.ts": "游戏核心/ink.ts",
              "WorldCanvas.tsx": "游戏核心/WorldCanvas.tsx",
              "ui.tsx": "游戏核心/ui.tsx",
          }
          for name, dest in mapping.items():
              src = ensure(name)
              raw = gzip.decompress(base64.b64decode(src.read_text().strip().encode("ascii")))
              Path(dest).write_bytes(raw)
              h = hashlib.sha256(raw).hexdigest()
              ok = h == expect[dest]
              print(dest, len(raw), h, "OK" if ok else "MISMATCH")
              if not ok:
                  raise SystemExit(f"sha mismatch for {dest}")
          PY
          wc -c "游戏核心/ink.ts" "游戏核心/WorldCanvas.tsx" "游戏核心/ui.tsx"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "游戏核心/ink.ts" "游戏核心/WorldCanvas.tsx" "游戏核心/ui.tsx"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "hotfix: decode 游戏核心 from grok-parts gz.b64 (2026-09-14)"
            git push
          fi
